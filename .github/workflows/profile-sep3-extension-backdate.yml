name: One-time September 3 profile project update

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply September 3 profile project update
        shell: bash
        run: |
          set -euo pipefail

          expected_blob="91034ce28c0187b4a23b4fefc22c0f95ec998267"
          actual_blob="$(git hash-object README.md)"
          if [ "$actual_blob" != "$expected_blob" ]; then
            echo "README changed unexpectedly: $actual_blob" >&2
            exit 1
          fi

          cp .github/profile-readme-sep3-target.md README.md
          rm .github/profile-readme-sep3-target.md
          rm .github/workflows/profile-sep3-extension-backdate.yml

          git config user.name "Johnny"
          git config user.email "92900710+JohnnyZLi@users.noreply.github.com"
          git add README.md .github/profile-readme-sep3-target.md .github/workflows/profile-sep3-extension-backdate.yml

          GIT_AUTHOR_DATE="2026-09-03T12:00:00-07:00" \
          GIT_COMMITTER_DATE="2026-09-03T12:00:00-07:00" \
            git commit -m "Add Alexa Shopping Suppressor to profile projects"

          git push origin HEAD:main
