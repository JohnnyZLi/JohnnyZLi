name: One-time profile refresh

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Add Fugue to profile
        shell: bash
        run: |
          python <<'PY'
          from pathlib import Path

          readme = Path("README.md")
          text = readme.read_text()
          row = "| **Fugue** | GitHub-backed coordination protocol for orchestrating software-engineering work across replaceable ChatGPT Worker and QA sessions with protected CI, review, and Integration state. | [Repository](https://github.com/JohnnyZLi/Fugue) |"
          anchor = "| **Reliable Transport over UDP**"

          if row not in text:
              if anchor not in text:
                  raise SystemExit("README anchor not found")
              text = text.replace(anchor, row + "\n" + anchor, 1)
              readme.write_text(text)

          Path(".github/workflows/profile-refresh.yml").unlink()
          PY

          git config user.name "Johnny"
          git config user.email "92900710+JohnnyZLi@users.noreply.github.com"
          git add -- README.md .github/workflows/profile-refresh.yml
          git commit --date="2026-08-16T12:00:00-07:00" -m "Add Fugue to profile projects"
          git push origin HEAD:main
