name: One-time July 23 profile refresh

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply profile scanability refresh with matched July 23 timestamps
        shell: bash
        run: |
          set -euo pipefail

          expected_blob="26843a5402e4e16996f434cf868e52991f3e2663"
          actual_blob="$(git hash-object README.md)"
          if [ "$actual_blob" != "$expected_blob" ]; then
            echo "README changed unexpectedly: $actual_blob" >&2
            exit 1
          fi

          cp .github/profile-readme-target.md README.md
          rm .github/profile-readme-target.md
          rm .github/workflows/profile-july23-backdate.yml

          git config user.name "Johnny"
          git config user.email "92900710+JohnnyZLi@users.noreply.github.com"
          git add README.md .github/profile-readme-target.md .github/workflows/profile-july23-backdate.yml

          GIT_AUTHOR_DATE="2026-07-23T12:00:00-07:00" \
          GIT_COMMITTER_DATE="2026-07-23T12:00:00-07:00" \
            git commit -m "Improve profile scanability for network roles"

          git push origin HEAD:main
