name: One-time profile README refresh

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Refresh profile with matched August 16 timestamps
        shell: bash
        run: |
          set -euo pipefail
          expected_blob="c4f2eaae35689e48a83ff46b97e6585b79918a43"
          actual_blob="$(git hash-object README.md)"
          if [ "$actual_blob" != "$expected_blob" ]; then
            echo "README changed unexpectedly: $actual_blob" >&2
            exit 1
          fi

          cat > /tmp/profile-readme.b64 <<'EOF'

EOF
          base64 --decode /tmp/profile-readme.b64 > README.md
          rm -f /tmp/profile-readme.b64
          rm -f .github/workflows/profile-readme-backdate.yml

          git config user.name "Johnny"
          git config user.email "92900710+JohnnyZLi@users.noreply.github.com"
          export GIT_AUTHOR_DATE="2026-08-16T12:00:00-07:00"
          export GIT_COMMITTER_DATE="2026-08-16T12:00:00-07:00"
          git add README.md .github/workflows/profile-readme-backdate.yml
          git diff --cached --check
          git commit -m "Refresh profile around current network systems work"
          git push origin HEAD:main
